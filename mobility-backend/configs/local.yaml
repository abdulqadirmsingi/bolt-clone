env: local

grpc:
  port: 50051

http:
  port: 8080

# Override with POSTGRES_DSN env if your DB user is not "postgres" (e.g. on Mac: postgres://YOUR_MAC_USER@localhost:5432/mobility?sslmode=disable)
postgres:
  dsn: "postgres://postgres:postgres@localhost:5432/mobility?sslmode=disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

fireball:
  min_distance_meters: 15
  min_heading_degrees: 10
  max_silence_seconds: 30
  throttle_ms: 2000

h3:
  resolution: 9
  default_k_ring: 2

jwt:
  secret: "change-me-in-production"
  expire_mins: 1440

driver:
  heartbeat_interval_seconds: 15
  heartbeat_timeout_seconds: 45
