syntax = "proto3";

package mobility.v1;

option go_package = "github.com/zeng/mobility-backend/internal/proto/gen;gen";

// Driver status for presence/availability state machine: OFFLINE → ONLINE → ON_TRIP → ONLINE → OFFLINE.
enum DriverStatus {
  DRIVER_STATUS_UNSPECIFIED = 0;
  DRIVER_STATUS_OFFLINE = 1;
  DRIVER_STATUS_ONLINE = 2;
  DRIVER_STATUS_ON_TRIP = 3;
}

// Driver service: nearby drivers (H3-based), driver availability (push-based), presence (SetAvailability, Heartbeat).
service DriverService {
  rpc GetNearbyDrivers(GetNearbyDriversRequest) returns (GetNearbyDriversResponse);
  // Rider/app subscribes to availability updates for a region (e.g. after opening map).
  rpc StreamDriverAvailability(StreamDriverAvailabilityRequest) returns (stream DriverAvailabilityUpdate);
  // Driver goes online/offline/on_trip. Only ONLINE and ON_TRIP drivers appear in H3 and nearby.
  rpc SetAvailability(SetAvailabilityRequest) returns (SetAvailabilityResponse);
  // Driver sends heartbeat every N seconds; if no heartbeat, server marks OFFLINE and removes from H3.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message GetNearbyDriversRequest {
  double lat = 1;
  double lng = 2;
  int32 k_ring = 3;  // optional; 0 = use default
}

message DriverSummary {
  string driver_id = 1;
  double lat = 2;
  double lng = 3;
  double heading_degrees = 4;
  int64 updated_at_ms = 5;
}

message GetNearbyDriversResponse {
  repeated DriverSummary drivers = 1;
}

message StreamDriverAvailabilityRequest {
  double lat = 1;
  double lng = 2;
  int32 k_ring = 3;  // 0 = use server default
}

message DriverAvailabilityUpdate {
  repeated DriverSummary drivers = 1;  // snapshot of drivers in K-ring at this moment (ONLINE/ON_TRIP only)
  int64 updated_at_ms = 2;
}

message SetAvailabilityRequest {
  string driver_id = 1;
  DriverStatus status = 2;
}

message SetAvailabilityResponse {
  bool ok = 1;
}

message HeartbeatRequest {
  string driver_id = 1;
  int64 client_timestamp_ms = 2;
}

message HeartbeatResponse {
  bool ok = 1;
  int64 server_timestamp_ms = 2;
}
