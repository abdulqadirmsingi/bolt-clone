name: mobility_app
description: Real-time mobility and delivery app (Bolt-style).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  grpc: ^3.2.0
  protobuf: ^2.1.0
  geolocator: ^10.1.0
  get_it: ^7.6.0
  go_router: ^12.1.0
  flutter_riverpod: ^2.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  protoc_plugin: ^20.0.0
